name: Browser Agent Harness Validation

on:
  push:
    branches:
      - feat/browser-agent-runtime-m0
  pull_request:
    branches:
      - master

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo ready
      - run: pnpm --filter chrome-extension test
      - run: pnpm type-check
      - run: pnpm exec turbo lint --continue
      - run: pnpm build
