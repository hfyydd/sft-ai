name: browser-agent-harness

on:
  push:
    branches: ['master', 'feat/browser-agent-runtime-m0']
  pull_request:
    branches: ['master']

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.1
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter chrome-extension test
      - run: pnpm type-check
      - run: pnpm exec turbo lint --continue
      - run: pnpm build
